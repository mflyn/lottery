[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery"
version = "0.1.0"
description = "A lottery analysis and prediction tool"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pytest",
    "xgboost",
    "requests>=2.25.1",
    "beautifulsoup4>=4.9.3",
    "pyyaml>=6.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0", "xlrd>=2.0.1"]
explain = ["shap>=0.44.1", "lime>=0.2.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not gui"]
markers = ["gui: requires a working desktop session and real Tk windows"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = [".", "src"]
